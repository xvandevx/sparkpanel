# Образ SparkPanel (webSite/headless/Dockerfile) собирается только намеренно:
#   - тег версии: git tag v1.4.0 && git push origin v1.4.0 — собрать для amd64
#     и arm64, выпустить образ и GitHub Release (заметки — из коммитов с прошлой
#     версии). Порядок выпуска — webSite/headless/README.md, «Как выпустить версию»
#   - кнопка «Run workflow» во вкладке Actions — только собрать, ничего не выпуская
#     (проверить, что образ не сломан)
# Push в main и пулреквесты образ не трогают.
#
# Версия живёт только в теге: v1.4.0 → образ :1.4.0, :1.4, :1, :latest
# и метка org.opencontainers.image.version. Пре-релиз (v1.5.0-rc.1) получает
# только свой тег :1.5.0-rc.1, а Release помечается как пре-релиз.
#
# Адреса: всегда GHCR (ghcr.io/<владелец>/sparkpanel) и Docker Hub
# (docker.io/<DOCKERHUB_NAMESPACE>/sparkpanel), если в настройках репозитория
# заданы переменная DOCKERHUB_NAMESPACE и секреты DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# Не заданы — Docker Hub пропускается, выпуск идёт в один GHCR.
name: image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/sparkpanel
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/sparkpanel
  IS_DOCKERHUB: ${{ vars.DOCKERHUB_NAMESPACE != '' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.IS_DOCKERHUB }}
          # :latest — только стабильной версии: у пре-релиза metadata-action
          # оставляет один {{version}}, без :1, :1.4 и :latest
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: startsWith(github.ref, 'refs/tags/v') && env.IS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: webSite
          file: webSite/headless/Dockerfile
          # Две архитектуры собираются долго — только для выпуска
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Описание на Docker Hub — README репозитория. Не вышло (токен без права
      # delete) — образ уже выпущен, выпуск из-за описания не валим
      - if: startsWith(github.ref, 'refs/tags/v') && env.IS_DOCKERHUB == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/sparkpanel
          short-description: Self-hosted headless CMS for multi-domain websites, with a REST API and MCP
          readme-filepath: README.md
          enable-url-completion: true

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Заметки — заголовки коммитов (Conventional Commits) с прошлой стабильной
      # версии, по типам. Первый выпуск — вся история
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude 'v*-*' "$TAG^" 2>/dev/null || true)
          range="$TAG"
          if [ -n "$prev" ]; then range="$prev..$TAG"; fi
          git log --no-merges --format='%s (%h)' "$range" > commits.txt

          type='(\([^)]*\))?'
          group() {  # заголовок, дальше — аргументы grep -E (отбор строк)
            title=$1; shift
            lines=$(grep -E "$@" commits.txt | sed 's/^/- /' || true)
            if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$title" "$lines"; fi
          }
          version=${TAG#v}
          {
            group 'Breaking changes' "^[a-z]+$type!: "
            group 'Features' "^feat$type: "
            group 'Fixes' "^fix$type: "
            group 'Performance' "^perf$type: "
            group 'Other changes' -v "^([a-z]+$type!|feat$type|fix$type|perf$type): "
            printf '### Image\n\n```bash\ndocker pull %s:%s\n' "${GHCR_IMAGE,,}" "$version"
            if [ "$IS_DOCKERHUB" = true ]; then printf 'docker pull %s:%s\n' "${DOCKERHUB_IMAGE,,}" "$version"; fi
            printf '```\n\n'
            if [ -n "$prev" ]; then
              printf '**Full changelog:** %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG"
            fi
          } > notes.md
          cat notes.md

      # К выпуску — compose и шаблон секретов: быстрый старт в README качает их
      # по адресу releases/latest/download/…, без клона репозитория
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp webSite/headless/.env.example env.example
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}" \
            webSite/headless/docker-compose.yml env.example
