# Локальный reverse-proxy — как на проде: один origin http://localhost:3400
#   /api/...     -> бэкенд (NestJS, :3402)
#   /uploads/... -> бэкенд: файлы медиатеки из папки backend/uploads
#   /...         -> фронтенд (Next.js, :3401)
#
# Зачем: OAuth-колбэк Google регистрируется на http://localhost:3400/api/auth/google/callback,
# а бэкенд после логина редиректит на "/?token=..." (относительно!). Оба варианта верны
# только если фронт и API живут на одном origin — это и делает nginx.
#
# host.docker.internal — это хост-машина: dev-серверы фронта/бэка крутятся не в контейнерах.

upstream aiadmin_backend {
    server host.docker.internal:3402;
}

upstream aiadmin_frontend {
    server host.docker.internal:3401;
}

server {
    # Внутри контейнера слушаем 80, наружу docker публикует 3400 (см. docker-compose.yml)
    listen 80;
    server_name localhost;

    # Загрузка файлов/ответы бэка могут быть крупными.
    # Лимит одного файла в бэкенде — 20 МБ, здесь запас на multipart-обвязку.
    client_max_body_size 25m;

    # --- API ---
    # proxy_pass без URI-части => исходный путь (/api/users) уходит как есть,
    # а у NestJS выставлен глобальный префикс "api" — совпадает.
    location /api/ {
        proxy_pass http://aiadmin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Медиатека: /uploads/<ключ> -> бэкенд ---
    # Файлы лежат папкой backend/uploads, отдаёт их NestJS (storage/serve-uploads.ts):
    # он же решает, показать файл или отдать на скачивание. Путь уходит как есть.
    location /uploads/ {
        proxy_pass http://aiadmin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # --- Фронтенд (включая HMR по websocket) ---
    location / {
        proxy_pass http://aiadmin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Next в dev иногда думает долго
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
