# SparkPanel целиком: панель (один образ) + Postgres. Файлы — папка в томе
# uploads, отдаёт их сама панель (/uploads/…); S3 при желании подключается
# в панели, «Настройки → Хранилища».
# Пример для того, кто ставит панель себе. Рядом — .env (шаблон .env.example).
#
#   docker compose up -d        → http://localhost:3000
#   docker compose pull && docker compose up -d   — обновить до свежей версии
#
# Образ — выпущенный в GHCR; версия — SPARKPANEL_VERSION в .env (по умолчанию
# latest). Собрать из исходников — раскомментировать `build` в клоне репозитория
# и `docker compose up -d --build`. HTTPS — забота прокси перед панелью (Caddy,
# Traefik, nginx): она отдаёт и /api, и страницы с одного порта, прокси нужно
# провести только его.

name: sparkpanel

services:
  sparkpanel:
    image: ghcr.io/xvandevx/sparkpanel:${SPARKPANEL_VERSION:-latest}
    # build:
    #   context: ..
    #   dockerfile: headless/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # База — одной строкой. Своя (managed) база: подставьте её адрес, сервис
      # postgres ниже тогда не нужен; TLS — `?sslmode=require` в конце строки
      DATABASE_URL: postgres://sparkpanel:${DB_PASSWORD:?задайте DB_PASSWORD в .env}@postgres:5432/sparkpanel
      # Внешний адрес панели (https://cms.example.com): из него — полные адреса файлов
      # во внешнем API и `servers` его спецификации. Пусто — берётся из запроса
      PUBLIC_URL: ${PUBLIC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:?задайте PRIVATE_KEY в .env}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sparkpanel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sparkpanel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sparkpanel"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
