# SparkPanel целиком: панель (один образ) + Postgres + MinIO для файлов.
# Файлы MinIO (/uploads/…) отдаёт сама панель — наружу MinIO не публикуется.
# Пример для того, кто ставит панель себе. Рядом — .env (шаблон .env.example).
#
#   docker compose up -d        → http://localhost:3000
#
# Пока образ не публикуется, его собирают сами (`build` ниже). HTTPS — забота
# прокси перед панелью (Caddy, Traefik, nginx): она отдаёт и /api, и страницы
# с одного порта, прокси нужно провести только его.

name: sparkpanel

services:
  sparkpanel:
    build:
      context: ..
      dockerfile: headless/Dockerfile
    image: sparkpanel:dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # База — одной строкой. Своя (managed) база: подставьте её адрес, сервис
      # postgres ниже тогда не нужен; TLS — `?sslmode=require` в конце строки
      DATABASE_URL: postgres://sparkpanel:${DB_PASSWORD:?задайте DB_PASSWORD в .env}@postgres:5432/sparkpanel
      # Внешний адрес панели (https://cms.example.com): из него — полные адреса файлов
      # во внешнем API и `servers` его спецификации. Пусто — берётся из запроса
      PUBLIC_URL: ${PUBLIC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:?задайте PRIVATE_KEY в .env}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sparkpanel-media
      S3_ACCESS_KEY: sparkpanel
      S3_SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY в .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sparkpanel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sparkpanel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sparkpanel"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: sparkpanel
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
