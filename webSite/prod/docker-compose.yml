# Прод aiAdmin: nginx (80/443) -> frontend (Next :3000) / backend (NestJS :3010) -> postgres.
# Файлы медиатеки — папка ./docker/uploads, её монтирует backend и отдаёт /uploads/.
# На сервер копируется ТОЛЬКО папка prod/. Образы приезжают из GHCR (пушит CI).
#
#   docker compose pull && docker compose up -d
#
# Секреты — в .env рядом (см. .env.example), в git не коммитятся.
#
# ВНУТРЕННИЕ порты контейнеров (3000/3010) с локальными 340x не конфликтуют:
# наружу здесь публикуются только 80/443 (и 9000 для Dozzle).

name: aipanel

services:
    nginx:
        image: nginx:1.27-alpine
        container_name: aipanel-nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - "./docker/nginx/conf.d:/etc/nginx/conf.d:ro"
            - "./docker/nginx/certs:/etc/nginx/certs"
            - "./docker/nginx/log:/var/log/nginx"
            - "./docker/nginx/auth:/etc/nginx/auth"
        depends_on:
            - frontend
            - backend
        networks:
            - internal-network
            - external-network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
        restart: always

    frontend:
        image: ghcr.io/ai-panel/frontend:main
        container_name: aipanel-frontend
        environment:
            NODE_ENV: production
            # БРАУЗЕР: пусто = относительные /api-пути, тот же origin через nginx (без CORS).
            NEXT_PUBLIC_API_HOST: ""
            # SSR: getServerSideProps выполняется ВНУТРИ контейнера, где относительный
            # путь "/api/..." резолвить не от чего — fetch требует абсолютный URL.
            # Ходим к бэкенду напрямую по внутренней сети, минуя nginx и TLS.
            API_HOST: http://backend:3010
        networks:
            - internal-network
        volumes:
            - /etc/localtime:/etc/localtime:ro
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
        restart: always

    backend:
        image: ghcr.io/ai-panel/backend:main
        container_name: aipanel-backend
        env_file: .env
        environment:
            NODE_ENV: production
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
        depends_on:
            - postgres
        networks:
            - internal-network
        volumes:
            - /etc/localtime:/etc/localtime:ro
            # Встроенное хранилище файлов (в образе UPLOADS_DIR=/data/uploads): бэкенд
            # кладёт туда загрузки и сам отдаёт их по /uploads/<ключ>. Это ВТОРОЙ том
            # с данными помимо postgres, его тоже надо бэкапить (см. README).
            # Владелец папки на сервере — uid 1001 (nestjs из образа бэкенда)
            - "./docker/uploads:/data/uploads"
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
        restart: always

    postgres:
        image: postgres:16-alpine
        container_name: aipanel-postgres
        env_file: .env
        ports:
            # Только петлевой интерфейс сервера: снаружи порт закрыт, доступ к базе
            # с рабочей машины — через SSH-туннель (см. prod/README.md).
            - "127.0.0.1:5432:5432"
        volumes:
            - "./docker/postgres:/var/lib/postgresql/data"
        networks:
            - internal-network
        logging:
            driver: json-file
            options:
                max-size: "1m"
                max-file: "3"
        restart: always

    # UI для логов всех контейнеров: http://<SERVER_IP>:9000
    dozzle:
        image: amir20/dozzle:latest
        container_name: aipanel-logs
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
            - DOZZLE_LEVEL=info
        ports:
            - "9000:8080"
        networks:
            - internal-network
            - external-network
        restart: unless-stopped

networks:
    internal-network:
        driver: bridge

    external-network:
        driver: bridge
