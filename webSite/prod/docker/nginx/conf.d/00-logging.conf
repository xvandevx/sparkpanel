# Детальный access log: upstream status/addr и тайминги — для диагностики 502/503/504.
log_format aipanel_detailed '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'host=$host '
                            'rt=$request_time '
                            'uct=$upstream_connect_time '
                            'uht=$upstream_header_time '
                            'urt=$upstream_response_time '
                            'us="$upstream_status" '
                            'ua="$upstream_addr"';

map $status $log_5xx {
    ~^[45]  1;
    default 0;
}

access_log /var/log/nginx/access.log aipanel_detailed;
access_log /var/log/nginx/errors-access.log aipanel_detailed if=$log_5xx;
error_log /var/log/nginx/error.log warn;
