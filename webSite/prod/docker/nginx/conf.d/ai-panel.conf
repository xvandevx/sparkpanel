# aiAdmin — один origin на фронт и API (как локально в webSite/docker/nginx):
#   /api/...     -> backend  (NestJS, глобальный префикс "api", :3010)
#   /uploads/... -> backend: файлы медиатеки из его папки (том docker/uploads)
#   /...         -> frontend (Next.js, :3000)
#
# Один origin обязателен: Google OAuth-колбэк регистрируется на
# https://ai-panel.app/api/auth/google/callback, а бэкенд после логина редиректит
# на "/?token=..." ОТНОСИТЕЛЬНО. Плюс фронт ходит в API относительными путями,
# поэтому CORS не нужен.
#
# TODO(домен): ai-panel.app — заглушка. Когда домен будет куплен, заменить его здесь,
# в prod/.env.example (GOOGLE_CALL_BACK), в prod/README.md и в Google Console.

# --- HTTP: только редирект на HTTPS (+ ACME на всякий случай) ---
server {
    listen 80;
    server_name ai-panel.app www.ai-panel.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://ai-panel.app$request_uri;
    }
}

# --- HTTPS: www -> apex ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.ai-panel.app;

    ssl_certificate     /etc/nginx/certs/live/ai-panel.app/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/ai-panel.app/privkey.pem;
    ssl_dhparam         /etc/nginx/certs/dhparam.pem;

    return 301 https://ai-panel.app$request_uri;
}

# --- HTTPS: сама админка ---
server {
    listen 443 ssl;
    http2 on;
    server_name ai-panel.app;

    ssl_certificate     /etc/nginx/certs/live/ai-panel.app/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/ai-panel.app/privkey.pem;
    ssl_dhparam         /etc/nginx/certs/dhparam.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_ecdh_curve X25519:secp384r1:secp521r1;

    # Загрузка файлов / крупные ответы бэка.
    # Лимит одного файла в бэкенде — 20 МБ, здесь запас на multipart-обвязку.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        font/woff2;

    # --- API ---
    # proxy_pass без URI-части => путь уходит как есть (/api/users), а у NestJS
    # выставлен глобальный префикс "api" — совпадает.
    location /api/ {
        proxy_pass http://backend:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # Swagger в проде закрыт: раскомментировать basic-auth и убрать 404, если нужен.
    #   htpasswd -c docker/nginx/auth/docs.htpasswd admin
    location /api/docs {
        return 404;
        # auth_basic "aiAdmin docs";
        # auth_basic_user_file /etc/nginx/auth/docs.htpasswd;
        # proxy_pass http://backend:3010;
        # proxy_set_header Host $host;
    }

    # --- Медиатека: /uploads/<ключ> -> backend ---
    # Файлы лежат папкой (том docker/uploads), отдаёт их NestJS: тип, «показать или
    # скачать», вечный кэш и nosniff выставляет он сам. Путь уходит как есть.
    location /uploads/ {
        proxy_pass http://backend:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Сессию панели в раздачу файлов не пробрасываем: файлы читаются без входа
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    # --- Фронтенд ---
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Статика Next — можно кэшировать агрессивно (хэш в имени файла).
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
}
